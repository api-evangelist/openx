source: >-
  PyPI, Packagist, RubyGems and npm registry metadata endpoints, plus the
  github.com/openx organization and
  https://docs.openx.com/developers/api-third-party-libraries/
note: >-
  OpenX ships no modern, registry-published SDK. Every first-party client
  library it names is either GitHub-only (no registry release at all) or last
  released in 2021, and the one successor client OpenX itself points at —
  "pip install oxapiclient", per the README of github.com/openx/ox-api-client-py
  — has never been published to PyPI (HTTP 404). The published packages that do
  exist all wrap the OX3/OX4 OAuth 1.0 flow against sso.openx.com, which
  returned HTTP 502 when probed on 2026-08-13, so the newest first-party
  release predates the current OAuth 2.0 Platform API entirely. OpenX's own
  third-party-libraries page recommends generic OAuth libraries instead of its
  SDKs.
