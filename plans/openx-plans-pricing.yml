note: >-
  OpenX publishes no pricing page and no plans of any kind. https://www.openx.com/pricing/
  returns HTTP 404, and neither the marketing site nor the 964 published
  documentation sections carry a rate card, tier table, free tier or trial. The
  business model is transaction-fee based — OpenX takes a share of each
  impression cleared through the exchange — and every API surface requires an
  existing OpenX account provisioned through partner/BD onboarding, not signup.
  Two API surfaces additionally require a commercial negotiation before access:
  the OpenXBuild Real-Time Bidstream API ("Contract and commercial details ...
  especially revenue share, payment term days, or tax language") and the
  Auction Insights API. Recorded as an honest zero, not an omission.
