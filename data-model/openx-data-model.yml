        crud: [create, read, update, delete]
        description: Reusable grouping of inventory for deals and pricing controls.
      - name: paymenthistory
        kind: object
        crud: [create, read, update, delete]
        description: Payment details for a specified account.
      - name: site
        kind: object
        crud: [create, read, update, delete]
        description: A collection of ad unit inventory.
      - name: sitesection
        kind: object
        crud: [create, read, update, delete]
