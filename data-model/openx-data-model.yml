  - name: OpenXSelect API (GraphQL)
    endpoint: https://api.openx.com/oa/graphql
    reference: https://docs.openx.com/openxselect/oxs-api-reference/
    status: BETA
    scalars: [uuid, timestamptz, numeric, Decimal, Decimal2, Decimal4, Decimal6, JSON, StringOrInt, UBigInt64, GraphQLUBigInt64, IntersectionOperation]
    entities:
      - name: Account
        description: The account the caller's API key is bound to.
      - name: Advertiser
        description: An advertiser scoped to an account.
      - name: Provider
        description: A data provider.
      - name: AccountProvider
        description: The mapping between Account and Provider.
      - name: Segment
        description: A named collection of identifiers uploaded to the OpenXSelect platform.
      - name: Audience
        description: A set of Segments combined via boolean operations.
      - name: Deal
        description: Supply-side inventory that may target an audience.
      - name: DealParticipants
        description: The DSPs, buyers and brands participating in a deal.
      - name: Package
        description: Targeting criteria and/or URL lists applicable to a deal.
      - name: Targeting
        description: Audience, content, context and placement targeting attributes.
      - name: URLTargeting
        description: Domain allowlist/blocklist targeting.
      - name: BidderOrder
        description: An advertising order grouping line items; defines advertiser, flight dates and budget.
      - name: BidderLineItem
        description: A line item linking an order, a creative and a deal.
      - name: BidderCreative
        description: An ad creative asset with markup payload; must be approved before use.
      - name: RetargetingSegment
        implements: RoutedSegment
      - name: PredefinedSegment
        implements: RoutedSegment
      - name: Export
        description: An audience export.
      - name: FrequencyCapping
      - name: CuratedDealBuyerDiscount
      - name: PdpConfig
      - name: ThirdPartyFeesConfig
      - name: ThirdPartyRevenue
    relationships:
      - from: Account
        to: Advertiser
        type: has_many
        via: advertisers
        evidence: '"Advertisers in this account, sorted by name ascending"'
      - from: AccountProvider
        to: Account
        type: belongs_to
        via: account_id
      - from: AccountProvider
        to: Provider
        type: belongs_to
        via: provider_id
      - from: AudienceSegment
        to: Audience
        type: belongs_to
        via: audience_id
      - from: AudienceSegment
        to: Segment
        type: belongs_to
        via: segment_id
      - from: BidderOrder
        to: Account
        type: belongs_to
        via: account_id
      - from: BidderLineItem
        to: BidderOrder
        type: belongs_to
        via: bidder_order_uid
      - from: BidderLineItem
        to: Deal
        type: belongs_to
        via: deal_id
      - from: BidderCreative
        to: Account
        type: belongs_to
        via: account_id
      - from: Deal
        to: Audience
        type: has_one
        via: audience
        evidence: '"A Deal represents supply-side advertising inventory that may target an audience"'
      - from: Deal
        to: DealParticipants
        type: has_many
        via: deal_participants
      - from: Package
        to: Targeting
        type: has_one
        via: targeting
      - from: RoutedSegment
        to: [RetargetingSegment, PredefinedSegment]
        type: interface_implementations
    enumerations_via:
      field: optionsByPath(path:)
      note: >-
        Many scalar fields are constrained to values fetched at runtime from
        optionsByPath, e.g. deal.currency, deal.deal_participants.demand_partner,
        segment.country. There is no static enum for these.
  - name: Reporting API
    base_url: https://api.openx.com/api/v1/reporting-api
    reference: https://docs.openx.com/publishers/reporting-api-reference/
    entities:
      - name: Report
        fields: [id]
        description: An asynchronous report job; generateReport returns an id, pullReport exchanges it for CSV.
    dimensions_count: 41
    metrics_count: 9
    note: >-
      The dimension and metric vocabularies are the real data model here — 41
      case-sensitive dimensions (Day, Hour, PageDomain, DealId, DspAccountId,
      PublisherPlatformId, UserGeoCountry, …) and 9 metrics (AllRequests,
      Impressions, ExchangeFills, MarketRequests, VideoStarts, VideoCompletions,
      PrivateMarketImpressions, PublisherRevenueInPCoin,
      PrivateMarketPublisherGrossRevenueInPCoin).
cross_domain_note: >-
  The Platform API `deal`/`package`/`account` objects and the OpenXSelect
  `Deal`/`Package`/`Account` GraphQL types describe overlapping business
  concepts but are separate models with separate identifiers; OpenX publishes no
  crosswalk between them. The Reporting API's DealId/PackageId dimensions are the
  only documented join point.
