generated: '2026-08-13'
method: searched
source: >-
  https://docs.openx.com/developers/api-ref/ and
  https://docs.openx.com/openxselect/oxs-api-reference/
note: >-
  OpenX publishes no OpenAPI and its GraphQL introspection is API-key gated, so
  this entity graph is read from OpenX's own published object references rather
  than derived from a machine-readable schema. Two distinct object models exist
  and they do not share identifiers: the Platform API (REST v4) model of the ad
  server, and the OpenXSelect (GraphQL) model of curation. Relationships are
  recorded only where the published field description or object description
  states the link.
domains:
  - name: Platform API (REST v4)
    base_url: https://api.openx.com/api/v1/ox/4.0
    reference: https://docs.openx.com/developers/api-ref/
    identifiers:
      pattern: every object carries both {object}_id (v3-era) and {object}_uid (v4)
      guidance: prefer IDs; some creates require the parent _uid specifically
    entities:
      - name: account
        kind: object
        crud: [create, read, update, delete]
        description: A business unit or business relationship — ad network, advertiser, publisher, or agency.
        subtypes: [account.network, account.publisher, account.advertiser, account.agency]
      - name: ad
        kind: object
        crud: [create, read, update, delete]
        description: The functional unit displayed in the ad space.
        subtypes_example: [ad.image]
      - name: adunit
        kind: object
        crud: [create, read, update, delete]
        description: A specific area on a site where ads are displayed.
      - name: adunitgroup
        kind: object
        crud: [create, read, update, delete]
        description: A collection of ad units, for companion ads or CMS mapping.
      - name: comment
        kind: object
        crud: [create, read, update, delete]
        description: Comment log attachable to any API object.
      - name: creative
        kind: object
        crud: [create, read, update, delete]
        description: The media asset used in an ad; references a local or remote file on the OpenX CDN.
      - name: deal
        kind: object
        crud: [create, read, update, delete]
        description: A prearranged agreement to sell specific inventory.
      - name: floorrule
        kind: object
        crud: [create, read, update, delete]
        description: Minimum price rules for ad space.
      - name: lineitem
        kind: object
        crud: [create, read, update, delete]
        description: Line item details associated with orders — pricing, goals, targeting.
      - name: optimization
        kind: object
        crud: [create, read, update, delete]
        description: Real-time selling rules — targeting criteria, minimum prices, advertiser and content filters.
      - name: order
        kind: object
        crud: [create, read, update, delete]
