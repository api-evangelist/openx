        crud: [read]
        documented: false
      - name: reports
        kind: service
        crud: [read]
        documented: false
    relationships:
      - from: account
        to: account
        type: belongs_to
        via: account_uid
        evidence: >-
          Batch create samples parent a new account under a parent_account_uid;
          responses carry parent_name and instance_uid.
      - from: order
        to: account
        type: belongs_to
        via: account_uid
        evidence: >-
          "to create an order, the account_uid is required. If you specify the
          account_id instead, the call will not work."
      - from: lineitem
        to: order
        type: belongs_to
        via: order
        evidence: '"Provides line item details associated with orders"'
      - from: adunitgroup
        to: adunit
        type: has_many
        via: adunitgroup
        evidence: '"Collections of ad units"'
      - from: sitesection
        to: site
