        type: RateLimits
  - aid: openx:openxselect-api
    name: OpenXSelect API
    description: >-
      GraphQL API (BETA) for the OpenXSelect curation platform — query
      providers, segments, audiences, deals and packages, and mutate
      audiences (create/update/archive/activate), deals, routed retargeting
      segments and the bidder object family (BidderOrder, BidderLineItem,
      BidderCreative). Authenticated with a 90-day organization-wide API key
      in an x-apikey header. Introspection is gated; the published reference
      documents ~120 objects, ~40 inputs, custom scalars and interfaces.
    humanURL: https://docs.openx.com/openxselect/oxs-api-reference/
    baseURL: https://api.openx.com/oa/graphql
    tags:
      - GraphQL
      - Curation
      - Audiences
      - Deals
      - Segments
    tags_raw:
      - graphql
      - curation
      - audiences
      - deals
      - segments
    properties:
