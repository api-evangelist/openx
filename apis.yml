        type: ErrorCatalog
      - url: data-model/openx-data-model.yml
        type: DataModel
  - aid: openx:openx-mcp-server
    name: OpenX MCP Server
    description: >-
      Live remote Model Context Protocol server at https://api.openx.com/mcp.
      Discovered by probe, not by documentation — OpenX does not mention MCP
      anywhere in its published docs, but the endpoint answers POST and GET
      with a JSON-RPC 2.0 envelope and an OAuth challenge. The tool list is
      auth-gated behind the same OAuth 2.0 authorization server that fronts
      the Platform API, advertised through RFC 9728 protected-resource
      metadata naming the resource "OpenX Platform API".
    humanURL: https://docs.openx.com/developers/api-authentication/
    baseURL: https://api.openx.com/mcp
    tags:
      - MCP
      - agent-native
      - Authentication
    tags_raw:
      - mcp
      - agent-native
      - oauth
    properties:
      - url: mcp/openx-mcp.yml
        type: MCPServer
      - url: authentication/openx-authentication.yml
        type: Authentication
      - url: scopes/openx-scopes.yml
        type: OAuthScopes
      - url: well-known/openx-well-known.yml
        type: WellKnown
  - aid: openx:openxbuild-real-time-bidstream-api
    name: OpenXBuild Real-Time Bidstream API
    description: >-
      An inverted API — OpenX is the caller. A partner implements an
      enrichment service that OpenX hosts as a container inside its own
      Kubernetes namespace and calls in the auction path, either as HTTP
      POST /openrtb25 with an OpenRTB 2.5 BidRequest projection, or as the
      IAB Agentic RTB Framework gRPC RTBExtensionPoint.GetMutations over
      OpenRTB 2.6 protos. The service returns segment activations, extended
      identifiers, or deal floor overrides inside a 10 ms budget. No baseURL
      is recorded because the endpoint is the partner's container, assigned a
      port by OpenX at deployment time.
    humanURL: https://docs.openx.com/marketers/openxbuild/oxb-rtb-api/
    tags:
      - OpenRTB
      - gRPC
      - bidstream
      - Enrichment
      - iab-artf
    tags_raw:
      - openrtb
      - grpc
      - bidstream
      - enrichment
      - iab-artf
    properties:
      - url: https://docs.openx.com/marketers/openxbuild/oxb-rtb-api-spec/
        type: APIReference
      - url: https://docs.openx.com/marketers/openxbuild/oxb-rtb-api-artf/
        type: Documentation
