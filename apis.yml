aid: openx
name: OpenX
description: >-
  OpenX is an independent supply-side platform (SSP) and programmatic ad
  exchange headquartered in Pasadena, California, founded in 2008. OpenX
  connects publishers and app developers to advertiser demand through a
  real-time marketplace that runs OpenRTB-based auctions across display,
  video, CTV, native, and mobile inventory. Its product suite is organized
  around the OpenX Exchange (the core marketplace), OpenXSelect (curation,
  deal creation, and supply-path targeting), OpenXBuild (real-time bidstream
  enrichment, auction insights, and identity resolution), and OpenXControl
  (publisher yield management and demand routing). OpenX runs five developer
  surfaces on api.openx.com: a REST Platform API (v4) for accounts,
  inventory, orders, deals, and targeting; a Reporting API for asynchronous
  CSV report generation across 41 dimensions and 9 metrics; an OpenXSelect
  GraphQL API for audiences, segments, deals, and bidder objects; an
  OpenXBuild Real-Time Bidstream API that a partner implements as a
  containerized enrichment service (HTTP POST /openrtb25 plus an IAB Agentic
  RTB Framework gRPC RTBExtensionPoint); and an undocumented but live remote
  MCP server. Authentication is OAuth 2.0 authorization-code with PKCE
  fronted by Google Cloud Identity Platform, published through real OIDC and
  RFC 9728 discovery documents, with a separate 90-day x-apikey credential
  for the GraphQL API. OpenX publishes no OpenAPI, no Postman collection, no
  status page, no pricing, and no security.txt, and its documentation site
  currently renders as a broken single-page-app shell whose underlying
  content survives only as a JSON search index. The company is a major
  contributor to the Prebid.org header-bidding ecosystem and maintains a
  large GitHub organization, though its first-party API client libraries were
  last released to a package registry in 2021 and still target a legacy
  OAuth 1.0 login host that now returns HTTP 502. The business model is
  transaction-fee based, and API access requires an active OpenX account and
  BD/account-management onboarding rather than self-service signup.
