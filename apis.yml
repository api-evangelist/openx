        type: GettingStarted
      - url: authentication/openx-authentication.yml
        type: Authentication
      - url: conventions/openx-conventions.yml
        type: Conventions
      - url: errors/openx-error-types.yml
        type: ErrorCatalog
      - url: data-model/openx-data-model.yml
        type: DataModel
      - url: rate-limits/openx-rate-limits.yml
        type: RateLimits
  - aid: openx:openx-reporting-api
    name: OpenX Reporting API
    description: >-
      Asynchronous reporting API for authorized OpenX publishers. POST
      generateReport with dimensions, metrics, filters, reportType
      (HOURLY|DAILY) and an ISO-8601 date range returns a report id; POST
      pullReport exchanges that id for a CSV (HTTP 202 while still
      generating). 41 case-sensitive dimensions and 9 metrics, a 1,000,000-row
      and 1 GB ceiling per report, and a 3-month (hourly) or 2-year (daily)
      lookback window.
    humanURL: https://docs.openx.com/publishers/reporting-api-reference/
    baseURL: https://api.openx.com/api/v1/reporting-api
    tags:
      - Reporting
      - Analytics
      - REST
      - Publishers
    tags_raw:
      - reporting
      - analytics
      - rest
      - publishers
    properties:
