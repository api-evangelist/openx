apis:
  - aid: openx:openx-platform-api
    name: OpenX Platform API
    description: >-
      JSON REST API (v4) for the OpenX ad server. Sixteen CRUD objects
      (account, ad, adunit, adunitgroup, comment, creative, deal, floorrule,
      lineitem, optimization, order, package, paymenthistory, site,
      sitesection, user) and six read-only services (audittrail, geo, market,
      options, session, subtypes). Batch create/update/delete, offset
      pagination via limit/offset with a has_more flag, and a per-object
      /available_fields endpoint that returns the field schema for a given
      action. Bearer token plus an X-Openx-Instance tenant header.
    humanURL: https://docs.openx.com/developers/api-ref/
    baseURL: https://api.openx.com/api/v1/ox/4.0
    tags:
      - Platform
      - REST
      - Inventory
      - Deals
      - Targeting
    tags_raw:
      - platform
      - rest
      - inventory
      - deals
      - targeting
    properties:
      - url: https://docs.openx.com/developers/api-ref/
        type: APIReference
