note: >-
  Only api.openx.com serves real /.well-known/ documents. It publishes OIDC
  discovery (identical body at /.well-known/openid-configuration and
  /.well-known/oauth-authorization-server), RFC 9728 protected-resource
  metadata naming the resource "OpenX Platform API", and a JWKS. Every other
  /.well-known/ path on api.openx.com answers HTTP 500 (an Apigee gateway
  error, not a 404). unity.openx.com returns HTTP 200 with the same 1,989-byte
  HTML single-page-app shell for EVERY /.well-known/ path, so it is recorded
  as a soft-200 catch-all and NOT counted as a hit. www.openx.com,
  docs.openx.com, login.openx.com and blog.openx.com return 404 on all paths.
