versioning:
  - api: OpenX Platform API
    scheme: uri-path
    current: '4.0'
    path: /api/v1/ox/4.0
    previous: '3.0'
    docs: https://docs.openx.com/developers/api-conventions/
    note: >-
      OpenX warns that instances still served at /ox/3.0/ are a different API and
      the v4 guide does not apply to them. Both major versions are live
      simultaneously on different instances; there is no published migration
      deadline for v3.
  - api: OpenX Reporting API
    scheme: uri-path
    current: v1
    path: /api/v1/reporting-api
  - api: OpenXSelect API (GraphQL)
    scheme: unversioned endpoint
    current: BETA
    path: /oa/graphql
    note: >-
      The whole OpenXSelect API is labelled BETA in the published reference.
      Change is managed with GraphQL field-level @deprecated directives plus a
      dated notice in the release notes, not with an endpoint version.
  - api: OpenXBuild Real-Time Bidstream API
    scheme: standard-pinned
    current: OpenRTB 2.5 (HTTP) / OpenRTB 2.6 proto + IAB ARTF (gRPC)
    path: POST /openrtb25
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  mechanism: >-
    GraphQL @deprecated directive on the field, plus a dated entry in the
    public release notes naming the replacement field and a removal date.
  note: >-
    OpenX has no standing deprecation policy page and does not advertise RFC 8594
    Sunset/Deprecation headers. It has, however, demonstrated the practice: the
    example below announced the replacement, the reason, and a hard removal date
    in advance.
  examples:
    - api: OpenXSelect API (GraphQL)
      deprecated: adunit_max_duration
      replacement: adunit_max_duration_range
      reason: >-
        The old field only allowed the fixed values 15/30/45/60; the replacement
        supports custom ranges.
      announced: '2025-06'
      announced_note: >-
        The release-notes page interleaves dates and entries ambiguously; the
        surrounding entries are dated 2025-06-10 and 2025-06-02. The removal
        date below is stated explicitly in the entry text.
      removal_date: '2025-07-31'
      source: https://docs.openx.com/resources/release-notes/
deprecated_operations: []
