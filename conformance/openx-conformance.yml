  - id: skadnetwork-4.0
    conforms: true
    evidence: >-
      "OpenX is now supporting version 4.0 of Apple's SKAdNetwork";
      https://docs.openx.com/demand-partners/ios14-and-skadnetwork-support/
  - id: gdpr
    conforms: true
    evidence: >-
      regs.ext.gdpr flag honoured; https://docs.openx.com/resources/gdpr-support/
  - id: coppa
    conforms: true
    evidence: regs.coppa flag honoured
  - id: eu-digital-services-act
    conforms: true
    evidence: >-
      "OpenX role is to act as a bridge ... and pass all new oRTB parameters"
